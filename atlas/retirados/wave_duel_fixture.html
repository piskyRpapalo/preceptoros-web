<script>
// Test-only fixture (never served by the site): the v1.1 reference fight on the wave duel scene.
// Colours = ui-arena-comun.js colores() fallbacks (the page has no CSS variables here).
window.colores = { dano: '#e0a060', fallo: '#9aa', tuya: '#ffb547', suya: '#b07cff', texto: '#ddd', mar: 'rgba(120,170,220,.09)' };
window.juega = function (op) {
  var K = AtlasCanon, A = AtlasArena, lugar = A.lugares().find(function (l) { return l.id === 'arrecife'; });
  var asa = [1, 2, 3].map(function (n) { return { tc: 'tc1', semilla: K.sha('w-captura-ref-' + n) }; });
  var semilla = K.sha('w-captura-ref-semilla'), c = A.combate(lugar.defensa.tropas, asa, semilla);
  window.__c = c;
  return AtlasWaveDuel.escena(document.getElementById('lienzo'), lugar.defensa.tropas, asa, c,
    Object.assign({ semilla: semilla, yo: 1, colores: window.colores, ronda: 'Round {r}', fallo: 'miss',
      letrero: function (x) { return { texto: x.gana === 'asalto' ? 'VICTORY' : 'DEFEAT' }; }, alFin: function () { window.__fin = true; } }, op || {}));
};
</script>
