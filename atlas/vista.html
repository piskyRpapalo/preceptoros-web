<!doctype html>
<html lang="en" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theGame · preview</title>
<!-- theGame · VISTA DEL JUEGO, no una pagina del sitio.

     Vive fuera de `public/`: no se despliega y no es una URL. Monta el juego
     igual que `thegame.js` dentro de su capa, pero sin cabezal: para mirar el
     panel y el motor solos.

     La lengua se cambia con `?lang=es` (o fr, pt, it, de, ru, el, ar). -->
<link rel="icon" type="image/svg+xml" href="../public/assets/favicon.svg">
<link rel="stylesheet" href="../public/assets/base.css">
<link rel="stylesheet" href="../public/assets/tema.css">
<link rel="stylesheet" href="../public/assets/soberano.css">
<link rel="stylesheet" href="../public/assets/atlas.css">
<style>
  /* Solo para esta vista: el ancho de la capa del juego. */
  main{max-width:min(1400px,96vw)}
</style>
<script>
  (function () {
    var l = new URLSearchParams(location.search).get('lang');
    var ok = ['en', 'es', 'fr', 'pt', 'it', 'de', 'ru', 'el', 'ar'];
    if (l && ok.indexOf(l) >= 0) {
      document.documentElement.lang = l;
      if (l === 'ar') { document.documentElement.dir = 'rtl'; }
    }
  })();
</script>
</head>
<body>
<main>
  <div id="atlas-juego"></div>
</main>
<script src="../public/assets/atlas-arte.js"></script>
<script src="../public/assets/atlas-mapa.js"></script>
<script src="../public/assets/atlas-dialogo.js" data-base="../public/assets/"></script>
<script src="../public/assets/atlas-motor.js"></script>
<script src="../public/assets/atlas-piso.js" data-base="../public/"></script>
<script>
  /* Lo que hace `thegame.js` al abrir la capa. */
  window.AtlasJuego.monta(document.getElementById('atlas-juego'), null);
  window.AtlasJuego.sigue();
</script>
</body>
</html>
