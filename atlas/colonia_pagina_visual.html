<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colony page · visual check</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #17131f; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  figure { margin: 0; background: #fff; border: 1px solid #17131f; }
  figure canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; }
  figcaption { font: 12px/1.3 ui-monospace, monospace; padding: 4px 6px; border-top: 1px solid #17131f; }
  pre { font: 12px/1.35 ui-monospace, monospace; background: #fff; border: 1px solid #17131f; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Colony page · the colony on the sky of its tick (SYNTHETIC fixture)</h1>
<div class="grid" id="fila"></div>
<h1 style="font-size:14px;margin-top:14px">Receipt</h1>
<pre id="recibo">running…</pre>
<script src="/game/tabla_semantica.js"></script>
<script src="/game/comic_tokens.js"></script>
<script src="/game/comic_accents.js"></script>
<script src="/game/comic_atoms.js"></script>
<script src="/game/valores.js"></script>
<script src="/game/gacha.js"></script>
<script src="/game/bubble_language.js"></script>
<script src="/game/bubble_letters.js"></script>
<script src="/game/state_frames.js"></script>
<script src="/game/hex_projection.js"></script>
<script src="/game/colony_state.js"></script>
<script src="/game/colonia_edificios.js"></script>
<script src="/game/palette_cycle.js"></script>
<script src="/game/colonia_pagina.js"></script>
<script>
(function (raiz) {
  'use strict';
  var CP = raiz.AtlasColoniaPagina, params = new URLSearchParams(raiz.location.search);
  var sabotaje = params.get('sabotaje') || '';
  var TICKS = [0, 60, 120, 180, 240];
  var W = 480, H = 320;
  // The synthetic colony of the door's fixture: the same rows, labelled SYNTHETIC on the page.
  var COLONIA = { nodes: [{ id: 'cabin', q: 0, r: 0 }, { id: 'ring-e', q: 1, r: 0 }, { id: 'ring-ne', q: 1, r: -1 }, { id: 'ring-nw', q: 0, r: -1 }, { id: 'ring-w', q: -1, r: 0 }, { id: 'ring-sw', q: -1, r: 1 }, { id: 'ring-se', q: 0, r: 1 }, { id: 'doggee-a', q: 2, r: 0 }, { id: 'doggee-b', q: 2, r: -1 }], buildings: [{ id: 'b-cabin', node: 'cabin' }, { id: 'b-ring-e', node: 'ring-e' }, { id: 'b-ring-nw', node: 'ring-nw' }, { id: 'b-ring-sw', node: 'ring-sw' }, { id: 'b-doggee-a', node: 'doggee-a' }, { id: 'b-doggee-b', node: 'doggee-b' }], units: [] };
  var LOOKS = { 'doggee-a': 'zombie', 'doggee-b': 'zombie' };

  function hashCanvas(canvas) {
    var d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data, h = 0x811c9dc5;
    for (var i = 0; i < d.length; i++) { h ^= d[i]; h = Math.imul(h, 0x01000193) >>> 0; }
    return ('00000000' + (h >>> 0).toString(16)).slice(-8);
  }

  // Sabotage "reloj" reads the wall clock on purpose: the detector must see the second run move and go red.
  function tickDe(t, reloj) { return reloj ? Math.floor(Date.now() / 1000) % 240 : t; }

  function celda(titulo) {
    var fig = document.createElement('figure'), canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var cap = document.createElement('figcaption'); cap.textContent = titulo;
    fig.appendChild(canvas); fig.appendChild(cap); document.getElementById('fila').appendChild(fig);
    return canvas;
  }

  function run() {
    var escenas = TICKS.map(function (t) { return { t: t, reducido: false, canvas: celda('tick ' + t) }; });
    escenas.push({ t: 0, reducido: true, canvas: celda('tick 0 · reduced motion') });
    var resultados = { scenes: [], n2: true, sabotaje: sabotaje || 'none' };
    escenas.forEach(function (e) { e.sc = CP.draw(e.canvas, COLONIA, e.t, e.reducido, LOOKS); e.cielo1 = e.sc.cielo; });
    var primera = escenas.map(function (e) { return hashCanvas(e.canvas); });
    escenas.forEach(function (e) {
      var t2 = tickDe(e.t, sabotaje === 'reloj');
      CP.draw(e.canvas, COLONIA, t2, e.reducido, LOOKS);
      if (sabotaje === 'jitter') { var g = e.canvas.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 1, 1); }   // sabotage: one pixel moves with no state change
    });
    var segunda = escenas.map(function (e) { return hashCanvas(e.canvas); });
    escenas.forEach(function (e, i) {
      resultados.scenes.push({ t: e.t, reducido: e.reducido, hash: primera[i], hash2: segunda[i], igual: primera[i] === segunda[i], cielo: e.cielo1 });
      if (primera[i] !== segunda[i]) { resultados.n2 = false; }
    });
    resultados.reducido_quieto = escenas[escenas.length - 1].cielo1 === '#f4ebd0';
    return resultados;
  }

  try {
    document.getElementById('recibo').textContent = JSON.stringify(run());
  } catch (error) {
    document.getElementById('recibo').textContent = 'ERROR · ' + error.message;
  }
})(this);
</script>
</body>
</html>
