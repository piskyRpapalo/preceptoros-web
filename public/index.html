<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreceptorOS · Elige tu idioma</title>
<style>
  :root { --fondo: #060B09; --ink: #DCE8E1; --glow: #3DF58F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: monospace; 
    background: var(--fondo); 
    color: var(--ink); 
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .selector { text-align: center; }
  h1 { font-size: 1.5rem; margin-bottom: 2rem; letter-spacing: 0.1em; }
  .idiomas { display: flex; gap: 1rem; justify-content: center; }
  a { 
    color: var(--glow); 
    text-decoration: none; 
    padding: 0.5rem 1rem;
    border: 1px solid var(--glow);
    transition: background 0.2s;
  }
  a:hover { background: rgba(61, 245, 143, 0.1); }
</style>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div class="selector">
    <h1>PRECEPTOROS</h1>
    <div class="idiomas">
      <a href="/es/">Español</a>
      <a href="/en/">English</a>
      <a href="/fr/">Français</a>
    </div>
  </div>
  <script>
    // Guardar elección al hacer click (solo en las páginas de contenido)
    document.querySelectorAll('.idiomas a').forEach(a => {
      a.addEventListener('click', () => {
        const lang = a.getAttribute('href').replace(/\//g, '');
        localStorage.setItem('preceptoros-lang', lang);
      });
    });
    // NO redirigir automáticamente desde el selector
  </script>
</body>
</html>
