<style>
  /* LA PUERTA ES EL DESPERTAR (2026-09-05). Habia dos pantallas antes de la
     primera frase: esta, con un selector de idiomas sobre marmol claro, y
     despues el telon de la lengua elegida, con el busto abriendose. Dos
     pantallas para lo mismo -- decidir en que idioma se entra -- y la bonita
     era la segunda.

     Se fusionan: el despertar ocurre AQUI, y cuando termina no cae ninguna
     cortina. La pantalla se queda quieta y espera. Las ocho lenguas son lo
     unico que se mueve, para que sea evidente que la decision es lo unico que
     falta.

     RUTEO PURO, sin `base.css` ni `tema.css`: la puerta tiene que cargar sola,
     antes que nada, y por eso repite aqui los pocos tokens que usa. Son los
     valores OSCUROS del canon, escritos en crudo, porque esta pagina no carga
     el fichero que los gira y una variable que no existe se lleva por delante
     la declaracion entera donde aparece.

     LOS OCHO OJOS SE FUERON CON LA PANTALLA VIEJA. Los pintaba solo esto; hoy
     no los pinta nadie, asi que salen tambien del precacheo del worker -- eran
     48.410 B que se descargaban en cada instalacion sin que los viera nunca
     nadie, que es exactamente el motivo por el que se trajeron aqui en su dia.
     Los ficheros siguen en `assets/`: dejan de viajar, no se borran. */
  :root { --fondo:#1e1929; --tinta:#ece9f5; --tenue:#a79fbe;
          --violeta:#6D5AE0; --violeta-texto:#b3a4ff;
          --bronce:#c9a227; --indigo:#a9a0f0; --jardin:#6fd39b;
          --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
          --spring:cubic-bezier(.34,1.56,.64,1); }
  /* Morfosis entre documentos: la puerta no se corta, se transforma en el chat. */
  @view-transition { navigation: auto; }
  * { box-sizing:border-box; margin:0; padding:0 }
  /* EL MARMOL, QUE ESTA PUERTA PERDIO AL REESCRIBIRSE. La portada vieja lo
     traia y la nueva salio con un color plano: era la unica pagina del sitio
     sin las vetas, y es justo la primera que se ve. Aqui va cosido a mano
     --esta pagina no carga `tema.css`, que es lo que gira el token-- y va la
     lamina OSCURA porque esta puerta es oscura siempre. */
  body { font:400 15px/1.6 var(--mono); color:var(--tinta);
    background:var(--fondo) url(/assets/marble-violet-oscuro.webp) repeat;
    background-size:340px;
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:1.5rem }
  .gate { text-align:center; max-width:32rem;
    display:flex; flex-direction:column; align-items:center; gap:1.3rem }

  /* LAS MISMAS CIFRAS QUE EL TELON DE LA APP, que es donde se firmaron: la
     tira recorrida en 1,2 s con `steps(7, jump-none)` --siete fotogramas, no
     ocho-- y el encuadre en `0.746% 50% / 770%`. La ventana va en c = 0,536
     porque el criterio no es el ojo sino la boca en el centro del circulo.

     Lo que NO se copia es la cortina cayendo a los 1,8 s: aqui no hay nada
     detras que descubrir. Termina de despertar y se queda. */
  .busto { width:min(58vw,300px); aspect-ratio:1; border-radius:50%;
    background:#2a2140 url("/assets/caras/cara-secuencia-apertura-256-telon.webp")
               0.746% 50%/770% auto no-repeat;
    border:3px solid var(--violeta);
    box-shadow:0 10px 34px rgba(109,90,224,.4);
    animation:despertar 1.2s steps(7,jump-none) 1 both }
  @keyframes despertar {
    from { background-position:0.746% 50% }
    to   { background-position:99.254% 50% } }
  h1 { font-size:clamp(1.4rem,7vw,2.4rem); font-weight:800; letter-spacing:.02em;
       color:var(--tinta); line-height:1.1 }
  h1 b { color:var(--violeta-texto); font-size:1.28em }

  /* LAS LENGUAS ENTRAN CUANDO EL BUSTO TERMINA, no antes: ofrecer la decision
     mientras algo se sigue moviendo es pedir dos cosas a la vez. 1,2 s de
     espera --lo que dura el despertar-- y despues se quedan flotando, que es
     lo unico que se mueve en esta pantalla. */
  .bubbles { display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap;
    animation:asoman .5s ease-out 1.2s both }
  @keyframes asoman { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  .bubble { position:relative; text-decoration:none; font-weight:700;
    padding:.6rem 1rem; background:rgba(255,255,255,.07); border:2px solid;
    border-radius:14px; animation:float 4.2s ease-in-out infinite;
    transition:transform .2s var(--spring) }
  .bubble::after { content:""; position:absolute; top:-9px; left:50%; margin-left:-6px;
    border:6px solid transparent; border-bottom-color:currentColor }
  .bubble:hover, .bubble:focus { transform:translateY(-3px) scale(1.03); outline:0 }
  /* EL COLOR LO REPARTE LA POSICION, NO LA LENGUA. Habia una regla por idioma
     --`.es`, `.en`, `.fr`-- y el portugues entro sin ninguna: se quedo con el
     color de arranque y el mismo compas que el español, y nadie lo vio. Con
     `nth-child` la novena lengua ya tiene su color y su retardo el dia que se
     escribe su bocadillo. */
  .bubble:nth-child(4n+1){color:var(--bronce);border-color:var(--bronce);animation-delay:0s}
  .bubble:nth-child(4n+2){color:var(--violeta-texto);border-color:var(--violeta-texto);animation-delay:-1.4s}
  .bubble:nth-child(4n+3){color:var(--indigo);border-color:var(--indigo);animation-delay:-2.8s}
  .bubble:nth-child(4n+4){color:var(--jardin);border-color:var(--jardin);animation-delay:-4.2s}
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .claim { font-size:.78rem; color:var(--tenue) }
  /* LA FORMULA DE LA CASA, y la tercera palabra en bronce porque es la que
     paga las otras dos. Conocimiento y herramientas los da cualquiera; lo que
     distingue a esto es de quien son. Va en las tres lenguas de la puerta por
     el mismo motivo que la frase anterior: quien llega no sabe todavia que
     esta pagina habla el suyo. */
  .so { color:var(--bronce); font-weight:700; letter-spacing:.02em }
  /* QUIEN PIDIO QUIETUD NO ESPERA UN SEGUNDO Y MEDIO A UNA DECISION. No se le
     deja la pantalla quieta a medio despertar: se le da entera y de golpe. */
  @media (prefers-reduced-motion:reduce) {
    .busto { animation:none; background-position:99.254% 50% }
    .bubbles { animation:none }
    .bubble { animation:none; transition:none } .bubble:hover { transform:none }
  }
</style>

</body>
