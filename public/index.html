<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreceptorOS · Elige tu idioma</title>
<style>
  /* Ruteo puro: sin base.css a proposito, para que el selector cargue solo.
     Pero con la identidad de la casa — era una terminal verde delante de un
     sitio de marmol violeta, y es lo PRIMERO que ve quien llega. */
  :root { --marmol:#E4E8EC; --marmol-claro:#F2F5F7; --tinta:#1E1826;
          --violeta:#6D5AE0; --violeta-texto:#4B37C4; --bronce:#78624C;
          --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 400 15px/1.6 var(--mono);
    background: var(--marmol) url(/assets/marble-violet.webp) repeat;
    background-size: 340px;
    color: var(--tinta);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .selector { text-align: center; background: rgba(242,245,247,.55);
    border: 1px solid rgba(255,255,255,.55); border-radius: 14px;
    box-shadow: 0 8px 32px rgba(30,24,38,.10); padding: 2rem 2.2rem; }
  @supports (backdrop-filter: blur(1px)) {
    .selector { -webkit-backdrop-filter: blur(16px) saturate(180%);
                backdrop-filter: blur(16px) saturate(180%); }
  }
  .sello { width: 64px; height: 85px; margin: 0 auto 1rem;
    background: url(/assets/seal-wake.gif) no-repeat center/64px 85px var(--marmol-claro);
    image-rendering: pixelated; border: 1px solid rgba(255,255,255,.55);
    border-radius: 8px; }
  h1 { font-size: 1.1rem; margin-bottom: 1.6rem; letter-spacing: .12em;
       font-weight: 700; color: var(--violeta-texto); }
  .idiomas { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  a { color: #fff; text-decoration: none; padding: .6rem .9rem;
      background: var(--violeta); border: 1px solid var(--violeta); border-radius: 8px;
      transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .2s ease; }
  a:hover, a:focus { background: var(--violeta-texto); transform: scale(1.02); outline: 0; }
  @media (prefers-reduced-motion: reduce) {
    a { transition: none } a:hover { transform: none }
    .sello { background-image: url(/assets/seal-rest.png) }
  }
</style>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#E4E8EC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div class="selector">
    <div class="sello" role="img" aria-label="Busto de marmol de Preceptor despertando"></div>
    <h1>PRECEPTOROS</h1>
    <div class="idiomas">
      <a href="/es/">Español</a>
      <a href="/en/">English</a>
      <a href="/fr/">Français</a>
    </div>
  </div>
  <script>
    // Guardar elección al hacer click (solo en las páginas de contenido)
    document.querySelectorAll('.idiomas a').forEach(a => {
      a.addEventListener('click', () => {
        const lang = a.getAttribute('href').replace(/\//g, '');
        localStorage.setItem('preceptoros-lang', lang);
      });
    });
    // NO redirigir automáticamente desde el selector
  </script>
</body>
</html>
