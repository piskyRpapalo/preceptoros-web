<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenWorld · PreceptorOS</title>
<meta name="description" content="OpenWorld: the global map and the chat. The tutorial cabin is always here; nodes appear only while they are alive.">
<link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
<link rel="canonical" href="https://preceptoros.org/openworld/">
<meta property="og:title" content="PreceptorOS · OpenWorld">
<meta property="og:description" content="The global map and the chat. The tutorial cabin is always here.">
<meta property="og:url" content="https://preceptoros.org/openworld/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://preceptoros.org/assets/og-card.png">
<meta name="theme-color" content="#17131F">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/landing.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:grid;grid-template-rows:1fr 1fr;max-width:none;width:100%;padding:0;min-height:100vh;box-sizing:border-box}
#map,#chat{padding:12px 16px;min-width:0;box-sizing:border-box;overflow:hidden}
#map{border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:8px;min-height:44vh}
#map h1{font-size:1.25rem;margin:0}
#map .surface{width:100%;flex:1;min-height:0;display:block;transition:opacity 300ms ease}
@media (prefers-reduced-motion: reduce){#map .surface{transition:none}}
#map .press{display:flex;flex-wrap:wrap;gap:8px}
#map .press button,#map .listen button{min-height:44px;padding:8px 14px;border:2px solid currentColor;border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
#map .press button[aria-pressed="true"]{outline:3px solid currentColor;outline-offset:2px}
#map .state{margin:0;color:var(--soft);font-size:.92rem}
#chat{display:flex;flex-direction:column;gap:8px;min-height:44vh}
#chat h2{font-size:1.1rem;margin:0}
#chat .log{flex:1;min-height:0;overflow:auto;margin:0;padding:0;list-style:none;color:var(--soft)}
#chat form{display:flex;gap:8px}
#chat input{flex:1;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit}
#chat button{min-height:44px;padding:8px 14px;border:2px solid currentColor;border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit}
#chat button:disabled,#chat input:disabled{opacity:.55}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (min-width:900px){main{grid-template-rows:1fr;grid-template-columns:1fr 1fr}#map{border-bottom:0;border-right:2px solid var(--line)}}
</style>
</head>
<body>
<a class="skip" href="#chat">Skip to the chat</a>
<main>
<section id="map" aria-labelledby="map-h">
<h1 id="map-h">OpenWorld</h1>
<div class="press" role="group" aria-label="Terrains">
<button type="button" id="t-cabin" aria-pressed="true" data-terrain="cabin">Tutorial cabin</button>
</div>
<canvas class="surface" id="surface" role="img" aria-label="The global map: the tutorial cabin, and any node that is alive"></canvas>
<div class="listen">
<button type="button" id="listen" aria-describedby="listen-state">Listen to the cabin</button>
</div>
<p class="state" id="listen-state" aria-live="polite"></p>
<p class="state" id="state" aria-live="polite">Nodes online: 0. The tutorial cabin is the basic world.</p>
</section>
<section id="chat" aria-labelledby="chat-h">
<h2 id="chat-h">Chat</h2>
<ul class="log" id="log" role="log" aria-live="polite">
<li>The chat is not live yet. This panel is ready for it.</li>
</ul>
<form id="entry" onsubmit="return false">
<label class="sr" for="question">Message</label>
<input id="question" type="text" autocomplete="off" disabled aria-describedby="chat-note">
<button type="submit" disabled>Send</button>
</form>
<p class="state" id="chat-note">The input opens when the chat is ready.</p>
</section>
</main>
<script src="/game/tabla_semantica.js"></script>
<script src="/game/comic_tokens.js"></script>
<script src="/game/comic_accents.js"></script>
<script src="/game/comic_atoms.js"></script>
<script src="/game/valores.js"></script>
<script src="/game/gacha.js"></script>
<script src="/game/bubble_language.js"></script>
<script src="/game/bubble_letters.js"></script>
<script src="/assets/pwa.js"></script>
<script>
// OpenWorld (NORTE 7 · PR 2). Same-origin only: the state file is the one thing read from the server.
// Default: zero nodes. A node that is not listed as alive does not exist on this map.
(function (raiz) {
  'use strict';
  var doc = raiz.document, ANCHO = 320, ALTO = 96;
  var TERRAINS = {
    cabin: { name: 'Tutorial cabin', x: 0.5, y: 0.5, always: true },
    atlantis: { name: 'Atlantis · Node Hexelion', x: 0.22, y: 0.3 },
    risen: { name: 'the Risen', x: 0.78, y: 0.7 }
  };
  var alive = [];
  var selected = 'cabin';
  var surface = doc.getElementById('surface');
  var press = doc.querySelector('#map .press');
  var state = doc.getElementById('state');

  // The bubble outline, as landing_doors.js draws it: pure data, the house bands only.
  function frame(title) {
    var RIM = [];
    for (var i = 0; i < 24; i++) { RIM.push([Math.round(160 + 150 * Math.cos(i * Math.PI / 12)), Math.round(44 + 38 * Math.sin(i * Math.PI / 12))]); }
    var WAVE_PTS = [];
    for (var j = 0; j <= 12; j++) { WAVE_PTS.push([136 + j * 4, Math.round((64 + 3 * Math.sin(j * Math.PI / 4)) * 10) / 10]); }
    return { v: 'preceptoros.bubble/1', id: 'terrain', t: 0, cv: [ANCHO, ALTO], atoms: [
      { k: 'bubble', r: 'a speech bubble', i: [
        { o: 'ribbon', pts: [[58, 66], [36, 94], [92, 72]], closed: true, f: 'paper', s: 'ink', lw: 3 },
        { o: 'ribbon', pts: RIM, closed: true, f: 'paper', s: 'ink', lw: 3 }] },
      { k: 'sea', r: 'a small wave', i: [{ o: 'ribbon', pts: WAVE_PTS, closed: false, s: 'cyan', lw: 2.5 }, { o: 'wave', x: 250, y: 72, sc: 0.35, h: [[1, 40, 10, 0], [3, 20, 5, 4]], f: 'paper', s: 'ink' }] },
      { k: 'title', r: title, i: [{ o: 'letters', x: 160, y: 42, tx: title, sz: 18, f: 'paper', s: 'ink', sh: [1.5, 1.5, 'cyan'] }] }] };
  }

  function draw() {
    var B = raiz.AtlasBubble, P = raiz.AtlasComicAtoms;
    if (!surface || !B || !P || !raiz.AtlasBubbleLetters) { return; }
    var width = surface.clientWidth || 320, height = surface.clientHeight || 200;
    var dpr = Math.min(2, raiz.devicePixelRatio || 1);
    surface.width = Math.round(width * dpr); surface.height = Math.round(height * dpr);
    var g = surface.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, width, height);
    var scale = Math.min(1, (width / 1.2) / ANCHO);
    Object.keys(TERRAINS).forEach(function (id) {
      var t = TERRAINS[id];
      if (!t.always && alive.indexOf(id) < 0) { return; }
      var x = t.x * width - (ANCHO * scale) / 2, y = t.y * height - (ALTO * scale) / 2;
      g.save(); g.translate(x, y); g.scale(scale, scale);
      try { P.paint(g, B.compile(frame(t.name))); } catch (e) { /* the node stays off the map; the list says so */ }
      g.restore();
    });
  }

  function buttons() {
    press.innerHTML = '';
    ['cabin'].concat(alive).forEach(function (id) {
      var b = doc.createElement('button');
      b.type = 'button'; b.textContent = TERRAINS[id].name;
      b.setAttribute('aria-pressed', String(id === selected));
      b.addEventListener('click', function () {
        selected = id; buttons();
        // A visible transition: the surface fades and returns. With reduced motion the redraw is at once.
        var quieto = raiz.matchMedia && raiz.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (quieto || !surface) { draw(); return; }
        surface.style.opacity = '0.25';
        raiz.setTimeout(function () { draw(); surface.style.opacity = '1'; }, 300);
      });
      press.appendChild(b);
    });
  }

  function render() {
    buttons();
    draw();
    state.textContent = 'Nodes online: ' + alive.length + '. The tutorial cabin is the basic world.';
  }

  // Only the two named nodes can appear, and only when the state file lists them as alive.
  function accept(data) {
    var nodes = data && Array.isArray(data.nodes) ? data.nodes : [];
    alive = nodes.map(function (n) { return n && n.id; }).filter(function (id) { return id === 'atlantis' || id === 'risen'; });
  }

  // The sound is the frame's own (docs/bubble-language.md, sound and h). An AudioContext is made only on the click.
  var listen = doc.getElementById('listen'), listenState = doc.getElementById('listen-state');
  // The sound module is on demand: it loads on the first click, never on page load.
  function loadSound(then) {
    if (raiz.AtlasSonifyBubble) { then(raiz.AtlasSonifyBubble); return; }
    var script = doc.createElement('script');
    script.src = '/game/bubble_sonify.js';
    script.onload = function () { then(raiz.AtlasSonifyBubble); };
    script.onerror = function () { listenState.textContent = 'NO_DATA: the sound module could not be loaded'; };
    doc.head.appendChild(script);
  }
  if (listen) {
    listen.addEventListener('click', function () {
      loadSound(function (S) {
        var result = S.sonify(frame(TERRAINS[selected].name));
        if (!result.ok) { listenState.textContent = /^NO_DATA/.test(result.cause) ? result.cause : 'NO_DATA: ' + result.cause; return; }
        var Ctx = raiz.AudioContext || raiz.webkitAudioContext;
        if (!Ctx) { listenState.textContent = 'NO_DATA: this browser has no audio output'; return; }
        var context = new Ctx();
        var n = S.play(result, context);
        listenState.textContent = 'Playing ' + n + ' voices.';
      });
    });
  }
  render();
  raiz.addEventListener('resize', draw);
  if (raiz.fetch) {
    raiz.fetch('/openworld/state.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { accept(d); render(); })
      .catch(function () { /* no state file: zero nodes, which is the default */ });
  }
})(window);
</script>
</body>
</html>
