<style>
.radio-chat{margin-top:8px;border:2px solid currentColor;border-radius:12px;background:var(--bg);color:var(--fg)}
.radio-chat-alterna{display:flex;gap:8px;align-items:center;width:100%;min-height:44px;padding:6px 10px;border:0;background:none;color:inherit;font:inherit;text-align:left}
.radio-chat-ultimo{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radio-chat.plegado :is(.radio-chat-tabs,.radio-chat-lista,.radio-chat-no-data){display:none}
.radio-chat-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 8px}
.radio-chat-tab{min-height:44px;border:2px solid currentColor;border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;font-weight:700}
.radio-chat-tab[aria-selected="true"]{text-decoration:underline;border-width:3px}
.radio-chat-lista{margin:0;padding:6px 10px 10px;list-style:none;display:grid;gap:6px;max-height:40vh;overflow-y:auto}
.radio-chat-lista[hidden],.radio-chat-no-data[hidden]{display:none}
.radio-chat-no-data{margin:6px 10px;padding:8px;border:2px dashed currentColor}
html,body{height:100%}
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:grid;grid-template-rows:1fr 1fr;max-width:none;width:100%;padding:0;min-height:100vh;box-sizing:border-box}
#map,#chat{padding:12px 16px;min-width:0;box-sizing:border-box;overflow:hidden}
#map{border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:8px;min-height:44vh;overflow:auto}
#map h1{font-size:1.25rem;margin:0}
#map .surface{width:100%;flex:1;min-height:240px;display:block;transition:opacity 300ms ease}
@media (prefers-reduced-motion: reduce){#map .surface{transition:none}}
#map .press{display:flex;flex-wrap:wrap;gap:8px}
#map .press button{min-height:44px;padding:8px 14px;border:2px solid currentColor;border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
#map .press button[aria-pressed="true"]{outline:3px solid currentColor;outline-offset:2px}
#map .state{margin:0;color:var(--soft);font-size:.92rem}
#chat{display:flex;flex-direction:column;gap:8px;min-height:44vh;overflow:auto}
#chat h2{font-size:1.1rem;margin:0}
#chat .log{flex:1;min-height:0;overflow:auto;margin:0;padding:0;list-style:none;color:var(--soft)}
#chat form{display:flex;gap:8px}
#chat input{flex:1;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit}
#chat button{min-height:44px;padding:8px 14px;border:2px solid currentColor;border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit}
#chat button:disabled,#chat input:disabled{opacity:.55}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* The compact terminal (the Sovereign p0, buzon#30, 2026-11-02): ONE map on top, ONE panel below (right on desktop).
   Everything the page says lives in the panel as a voice with its speaker's name (terminal_panel.js). The tab sheets and
   the on-map stick are retired (retirados/RETIRO-joystick-20261102.md). Touch walks by tapping the map; arrows step. */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.topbar > a{display:inline-flex;align-items:center;min-width:44px;min-height:44px}
.stage{position:relative;display:flex;flex-direction:column;min-height:0;flex:1}
/* Zoom stays a layer on the map, top-right on a plate; its spoken level is a voice in the panel, never on the drawing. */
.stage #zoom-controls{position:absolute;top:6px;right:6px;z-index:2;display:flex;flex-direction:column;gap:2px;
  padding:2px;border:2px solid var(--line);border-radius:var(--radius);background:color-mix(in srgb,var(--bg) 78%,transparent)}
.stage #zoom-controls button{width:44px;height:44px;padding:0;font-size:1.3rem;font-weight:700;line-height:1}
@supports not (background:color-mix(in srgb,red 50%,transparent)){.stage #zoom-controls{background:var(--bg)}}
.voices{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.voice{border:2px solid var(--line);border-radius:var(--radius);padding:6px 10px;display:grid;gap:6px;color:var(--fg)}
.voice > .who{margin:0;font-weight:700;font-size:.9rem;text-decoration:underline}
.voice p{margin:0}
.voice .state{color:var(--fg);font-size:.95rem}
.voice button,.voice select{min-height:44px;min-width:44px;padding:8px 14px;border:2px solid currentColor;border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.voice .acts,.voice #joy [role="group"],#visitor-play > div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.voice #joy{display:grid;grap:6px}
.voice #joy label{display:inline-flex;align-items:center;gap:6px;min-height:44px}
#visitor-play h2{font-size:1rem;margin:0}
.next p{font-size:1.05rem}
.next button{aorder-width:3px;font-weight:700}
.next button[hidden]{display:none}
#more summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
.welcome{display:grid;gap:6px}
.welcome[hidden]{display:none}
.voice:has(> .welcome[hidden]){display:none}
.welcome h3{font-size:1.05rem;margin:0}
