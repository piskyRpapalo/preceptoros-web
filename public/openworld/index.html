<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenWorld · PreceptorOS</title>
<meta name="description" content="OpenWorld map and chat; tutorial cabin always here.">
<link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
<link rel="canonical" href="https://preceptoros.org/openworld/">
<meta property="og:title" content="PreceptorOS · OpenWorld">
<meta property="og:description" content="The map and chat; tutorial cabin always here.">
<meta property="og:url" content="https://preceptoros.org/openworld/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://preceptoros.org/assets/og-card.png">
<meta name="theme-color" content="#17131F">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/landing.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:grid;grid-template-rows:1fr 1fr;max-width:none;width:100%;padding:0;min-height:100vh;box-sizing:border-box}
#map,#chat{padding:12px 16px;min-width:0;box-sizing:border-box;overflow:hidden}
#map{border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:8px;min-height:44vh;overflow:auto}
#map h1{font-size:1.25rem;margin:0}
#map .surface{width:100%;flex:1;min-height:240px;display:block;transition:opacity 300ms ease}
@media (prefers-reduced-motion: reduce){#map .surface{transition:none}}
#map .press{display:flex;flex-wrap:wrap;gap:8px}
#map .press button,#map .listen button{min-height:44px;padding:8px 14px;border:2px solid currentColor;border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
#map .press button[aria-pressed="true"]{outline:3px solid currentColor;outline-offset:2px}
#map .state{margin:0;color:var(--soft);font-size:.92rem}
#joy{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:10px;border:2px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg)}
#joy [role="group"]{display:grid;grid-template-columns:repeat(3,minmax(44px,1fr));gap:6px;align-items:center}
#joy [aria-label="Walk to a neighbouring node"]{grid-column:1/-1;grid-template-areas:". ne nw" "w . e" "sw . se"}
#joy [aria-label="Walk to a neighbouring node"]>button:nth-child(1){grid-area:e}
#joy [aria-label="Walk to a neighbouring node"]>button:nth-child(2){grid-area:ne}
#joy [aria-label="Walk to a neighbouring node"]>button:nth-child(3){grid-area:nw}
#joy [aria-label="Walk to a neighbouring node"]>button:nth-child(4){grid-area:w}
#joy [aria-label="Walk to a neighbouring node"]>button:nth-child(5){grid-area:sw}
#joy [aria-label="Walk to a neighbouring node"]>button:nth-child(6){grid-area:se}
#joy button,#joy select{min-height:44px;min-width:44px;padding:6px;border:2px solid currentColor;border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
#joy [aria-live]{grid-column:1/-1}
@media(max-width:520px){#joy{grid-template-columns:1fr}}
#chat{display:flex;flex-direction:column;gap:8px;min-height:44vh}
#chat h2{font-size:1.1rem;margin:0}
#chat .log{flex:1;min-height:0;overflow:auto;margin:0;padding:0;list-style:none;color:var(--soft)}
#chat form{display:flex;gap:8px}
#chat input{flex:1;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit}
#chat button{min-height:44px;padding:8px 14px;border:2px solid currentColor;border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit}
#chat button:disabled,#chat input:disabled{opacity:.55}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (min-width:900px){main{grid-template-rows:1fr;grid-template-columns:1fr 1fr}#map{border-bottom:0;border-right:2px solid var(--line)}}
</style>
</head>
<body>
<a class="skip" href="#chat">Skip to the chat</a>
<main>
<section id="map" aria-labelledby="map-h">
<a href="/" style="display:inline-block;min-height:44px">Back</a>
<h1 id="map-h">OpenWorld</h1>
<div class="press" role="group" aria-label="Terrains">
<button type="button" id="t-cabin" aria-pressed="true" data-terrain="cabin">Tutorial cabin</button>
</div>
<div id="joy" aria-label="Walking controls"></div>
<canvas class="surface" id="surface" role="img" aria-label="The global map: tutorial cabin and live nodes"></canvas>
<div class="listen">
<button type="button" id="listen" aria-describedby="listen-state">Listen to the cabin</button>
</div>
<p class="state" id="listen-state" aria-live="polite"></p>
<p class="state" id="state" aria-live="polite">Nodes online: 0.</p>
<ul class="state" id="frases" aria-label="Map details"></ul>
<p><a href="/face/army.html" style="display:inline-flex;min-height:44px">Army · NO_DATA</a></p>
<div id="visitor-play" aria-label="Visitor play"></div>
</section>
<section id="chat" aria-labelledby="chat-h">
<h2 id="chat-h">Chat</h2>
<ul class="log" id="log" role="log" aria-live="polite">
<li>The chat is not live yet.</li>
</ul>
<form id="entry" onsubmit="return false">
<label class="sr" for="question">Message</label>
<input id="question" type="text" autocomplete="off" aria-describedby="chat-note">
<button type="submit">Send</button>
</form>
<p class="state" id="chat-note">NO_DATA: no local answer model is connected.</p>
</section>
</main>
<script src="/game/tabla_semantica.js"></script>
<script src="/game/comic_tokens.js"></script>
<script src="/game/comic_accents.js"></script>
<script src="/game/comic_atoms.js"></script>
<script src="/game/valores.js"></script>
<script src="/game/gacha.js"></script>
<script src="/game/bubble_language.js"></script>
<script src="/game/bubble_letters.js"></script>

<script src="/game/state_frames.js"></script>
<script src="/game/hex_projection.js"></script>
<script src="/game/colony_state.js"></script>
<script src="/game/map_scene.js"></script>
<script src="/game/colonia_edificios.js"></script>
<script src="/game/palette_cycle.js"></script>
<script src="/game/openworld_state.js"></script>
<script src="/game/colonia_pagina.js"></script>
<script src="/game/tutorial_walk.js"></script>
<script src="/game/colony_controls.js"></script>
<script src="/game/db.js"></script>
<script src="/game/visitor_account.js"></script>
<script src="/game/visitor_eggs.js"></script>
<script src="/game/visitor_play.js"></script>
<script src="/assets/pwa.js"></script>
<script src="/game/openworld_page.js"></script>
</body>
</html>
