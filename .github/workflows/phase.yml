name: phase
on:
  pull_request:
  push:
    branches: [main]

# Ronda 208 (A3): un run superseded de la misma rama se cancela y no consume runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  phase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check jsonschema
      - name: Same tree, two complete passes
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          for pass in 1 2; do
            node atlas/phase_T3_cases.mjs
            node atlas/phase_T3_cases.mjs --sabotages
            node atlas/chrome_launch_cases.mjs
            node atlas/phase_M0_cases.mjs
            if node atlas/phase_M0_cases.mjs --sabotage; then
              echo 'Deletion sabotage escaped validation'
              exit 1
            fi
            python3 test_web.py
            python3 atlas/test_atlas.py
            node arnes_sw.mjs
            node --test tests/citations.test.mjs
            node atlas/sin_undefined.mjs | tee "$RUNNER_TEMP/phase-chrome-$pass.json"
            node atlas/vector_casos.mjs
            node atlas/phase_gate.mjs
            git diff --check
          done
      - name: Chrome measurement receipt
        if: always()
        shell: bash
        run: |
          {
            echo '### Chrome CDP receipt'
            echo 'Startup uses --no-sandbox and --disable-dev-shm-usage only in GitHub Actions.'
            shopt -s nullglob
            receipts=("$RUNNER_TEMP"/phase-chrome-*.json)
            if [ "${#receipts[@]}" -eq 0 ]; then
              echo 'NO_DATA: browser gate was not reached; inspect earlier failing step.'
            fi
            for receipt in "${receipts[@]}"; do
              echo '~~~json'
              cat "$receipt"
              echo '~~~'
            done
          } >> "$GITHUB_STEP_SUMMARY"
