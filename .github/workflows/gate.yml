# La batería de doctrina de preceptoros.org, en cada PR y en cada push a main.
# Hasta hoy solo corría en la máquina de quien commiteaba: `main` no tenía
# guardia. Es la misma orden que un contribuidor lanza en local, sin nada más:
# biblioteca estándar más `jsonschema`, que valida `data/` contra su esquema.
name: gate

on:
  pull_request:
  push:
    branches: [main]

# Ronda 208 (A3): un run superseded de la misma rama se cancela y no consume runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # version_sw_gate compares HEAD^1..HEAD: on a PR merge ref that is
          # exactly the PR's effect on main; on a push to main, the new commit.
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check jsonschema
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Cached change ships with a new SW VERSION (frozen-map rule)
        run: |
          node atlas/version_sw_casos.mjs
          node atlas/version_sw_gate.mjs
      - name: Gates completos n=2
        run: |
          for pasada in 1 2; do
            echo "Gate pass $pasada/2"
            python -m unittest tests.test_module_attribution
            python -m unittest tests.test_faro_alarma
            python -m unittest tests.test_hitl_cerco
            python -m unittest tests.test_preflight
            python -m unittest tests.test_trailers_hook
            python bin/contar_rutas.py --check-doc DEPLOY.md
            python test_web.py
            python atlas/test_atlas.py
            node arnes_sw.mjs
            node --test 'tests/*.test.mjs'
            node atlas/npc_occupancy_cases.mjs
            node atlas/ventana_casos.mjs
            node atlas/radio_age_cases.mjs
            node atlas/hud_readings_cases.mjs
            node atlas/bubble_language_casos.mjs
            node atlas/bubble_editor_casos.mjs
            node atlas/bubble_paint_casos.mjs
            node atlas/front_door_browser.mjs
            node atlas/egg_reload_browser.mjs
            node atlas/face_names_browser.mjs
            node atlas/bubble_bestiary_casos.mjs
            node atlas/bubble_icons_casos.mjs
            node atlas/bubble_letters_casos.mjs
            node atlas/codex_casos.mjs
            node atlas/bout_casos.mjs
            node atlas/descent_sound_casos.mjs
            node atlas/descent_view_casos.mjs
            node atlas/mvp_casos.mjs
            node atlas/ficha_casos.mjs
            node atlas/matematica_casos.mjs
            node questions/ventana_casos.mjs
            node atlas/ecos_casos.mjs
            node atlas/barrido_casos.mjs
            node atlas/bubble_bust_casos.mjs
            node atlas/bubble_crab_casos.mjs
            node atlas/chrome_launch_cases.mjs
            node atlas/comic_accents_casos.mjs
            node atlas/comic_atoms_casos.mjs
            node atlas/comic_css_paridad_casos.mjs
            node atlas/comic_tokens_casos.mjs
            node atlas/sea_rift_casos.mjs
            node atlas/param_gate_casos.mjs
            node atlas/harness_agentes_casos.mjs
            node atlas/phase_M0_cases.mjs
            node atlas/phase_T3_cases.mjs
            node atlas/shell_schematics_casos.mjs
            node atlas/z_cutoff_casos.mjs
            node atlas/lexical_projector_casos.mjs
            node atlas/map_bubble_casos.mjs
            node atlas/todos_los_casos.mjs
          done
