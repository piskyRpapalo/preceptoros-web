# The doctrine battery of preceptoros.org, on every PR and every push to main.
# Until today it ran only on the machine of the person who committed: `main` had
# no guard. It is the same order a contributor runs locally, nothing more:
# the standard library plus `jsonschema`, which validates `data/` against its schema.
name: gate

on:
  pull_request:
  push:
    branches: [main]

# Round 208 (A3): a superseded run of the same branch cancels and consumes no runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # version_sw_gate compares HEAD^1..HEAD: on a PR merge ref that is
          # exactly the PR's effect on main; on a push to main, the new commit.
          # Full history (2026-11-01): a bump must not reuse any VERSION main already served.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check jsonschema
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Cached change ships with a new SW VERSION (frozen-map rule)
        run: |
          node atlas/version_sw_cases.mjs
          node atlas/version_sw_gate.mjs
          node atlas/colony_page_gate.mjs
          node atlas/sweep_cases.mjs
          python test_web.py

      - name: Full gates, two complete passes
        run: |
          for pass in 1 2; do
            echo "Gate pass $pass/2"
            python -m unittest tests.test_module_attribution
            python -m unittest tests.test_actions_alarm
            python -m unittest tests.test_hitl_fence
            python -m unittest tests.test_preflight
            python -m unittest tests.test_deploy_guard
            python -m unittest tests.test_trailers_hook
            python -m unittest test_seal tests.test_state_v2 atlas.test_brain_tools
            node --test tools/preceptor-coder/preceptor_coder_cases.mjs
            npx --yes --package=workerd@1.20261104.1 workerd test tests/world_worker_workerd.capnp
            python bin/count_routes.py --check-doc DEPLOY.md
            node --test atlas/puros/decor_move_cases.mjs
            node --test atlas/puros/decor_command_cases.mjs
            node --test atlas/puros/wave_duel_cases.mjs
            node --test atlas/puros/caravan_cases.mjs
            node --test atlas/puros/building_interiors_cases.mjs
            node --test atlas/puros/state_frames_cases.mjs
