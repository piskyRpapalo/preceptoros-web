# Cerco de fusion (R-CERCO-MERGE). Verde solo con la linea HITL del Soberano para la cabeza
# EXACTA de la PR en buzon#30. Se llama «hitl»: el Soberano lo activa como check requerido
# en main (ruleset). Ver docs/hitl-fence.md.
name: hitl

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Numero de PR a comprobar"
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hitl-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  hitl:
    name: hitl
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Linea HITL de buzon#30 para la cabeza exacta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUZON_TOKEN: ${{ secrets.BUZON_TOKEN }}
          PR_NUMERO: ${{ github.event.pull_request.number || inputs.pr }}
          PR_REPO: ${{ github.repository }}
          BUZON_REPO: piskyRpapalo/buzon
          BUZON_ISSUE: "30"
        run: python3 atlas/hitl_cerco.py
