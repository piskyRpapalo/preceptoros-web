# El FARO de la costa: en cada push a main y cada manana, compara byte a byte
# lo servido en preceptoros.org (apex, canonico) contra public/ de main. El gate mira cada
# PR, el vigia mira el estado de main; el faro mira la luz que llega de verdad.
# Nacio de una deriva medida (2026-10-19): el cuerpo servido iba 16 rutas por
# detras de main sin que ningun check lo viera. ROJO = alarma de deriva, no un
# fallo del script. Determinista y sin LLM.
name: faro

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

concurrency:
  group: faro
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  faro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Lo servido contra main, byte a byte
        env:
          GH_TOKEN: ${{ secrets.BUZON_TOKEN }}
        run: |
          set -uo pipefail
          python atlas/faro.py > faro.txt 2>&1; rc=$?
          cat faro.txt | tee -a "$GITHUB_STEP_SUMMARY"
          # Una lectura roja llega a buzon#30 (R-ALARMA-FARO). Sin el secreto lo dice y el paso queda rojo igual.
          if [ "$rc" -ne 0 ]; then
            python3 atlas/faro_alarma.py --texto faro.txt --rc "$rc" --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi
          exit "$rc"
