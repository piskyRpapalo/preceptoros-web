# La ADUANA PUBLICA de theGame, antes de que exista la del rack (sugerencia
# firmada por el Soberano, 2026-09-27). Cada partida firmada que entre en
# `partidas/` por PR se vuelve a jugar con el mismo motor: forma -> firma
# Ed25519 -> reproduccion. Una partida inventada, aunque este bien firmada,
# no se reproduce y el check se pone rojo con su motivo.
#
# DETERMINISTA Y SIN LLM: es `node atlas/verifica_partida.mjs`, lo mismo que
# correra el rack. `pull_request`, no `pull_request_target`: el codigo de un
# fork corre sin secretos y con permiso de solo lectura.
name: partidas

on:
  # The explicit verification gate is required on every mergeable PR.
  pull_request:
  workflow_dispatch:

# Ronda 208 (A3): un run superseded de la misma rama se cancela y no consume runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Volver a jugar cada partida
        run: |
          shopt -s nullglob
          fallos=0; total=0
          for f in partidas/*.json; do
            total=$((total+1))
            if node atlas/verifica_partida.mjs "$f"; then echo "ENTRA   $f"; else echo "RECHAZO $f"; fallos=$((fallos+1)); fi
          done
          echo "partidas: $total · rechazadas: $fallos"
          [ "$total" -gt 0 ] || echo "NO_DATA · no hay partidas en partidas/ todavia"
          [ "$fallos" -eq 0 ]
